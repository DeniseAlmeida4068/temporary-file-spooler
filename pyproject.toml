[project]
name = "temporary-file-spooler"
version = "0.1.1"
description = "Writes data to a memory buffer and transparently spills to a temp file when a threshold is exceeded."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
